<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>Hearing Test Post</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  :root { --teal: #3f9484; --teal-d: #2f7a6c; --mint: #e3f2ee; --maroon: #a3262f; --ink: #141414; --muted: #4b5652; --line: #cfe5df; }
  body { width: 1080px; height: 1080px; overflow: hidden; background: #f4f4f8; color: var(--ink);
    font-family: 'Hind Siliguri', 'Poppins', sans-serif; -webkit-font-smoothing: antialiased; }
  html[lang=en] body { font-family: 'Poppins', 'Hind Siliguri', sans-serif; }
  .card { position: absolute; inset: 40px; border-radius: 48px; border: 2px solid var(--line); overflow: hidden;
    background: linear-gradient(165deg, #dcefe9 0%, #eef7f4 45%, #ffffff 100%); padding: 48px 56px 40px; display: flex; flex-direction: column; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .logo img { height: 46px; display: block; }
  .badge { display: inline-flex; align-items: center; gap: 12px; background: var(--teal); color: #fff; border-radius: 999px;
    padding: 10px 26px; font-size: 26px; font-weight: 600; }
  html[lang=en] .badge { font-size: 21px; letter-spacing: .3px; }
  .badge::before { content: ''; width: 12px; height: 12px; border-radius: 50%; background: #fff; }
  h1 { font-size: 76px; font-weight: 700; line-height: 1.1; margin-top: 26px; }
  h1 span { color: var(--maroon); display: block; }
  html[lang=en] h1 { font-size: 66px; letter-spacing: -1.5px; line-height: 1.1; }
  .mid { display: grid; grid-template-columns: 440px 1fr; gap: 34px; margin-top: 18px; align-items: center; }
  .art { position: relative; height: 380px; }
  .art .halo { position: absolute; left: 10px; top: 0; width: 380px; height: 380px; border-radius: 50%; background: rgba(255,255,255,.75); }
  .art svg.man { position: absolute; left: 40px; bottom: 0; width: 320px; }
  .chart { position: absolute; right: -6px; bottom: 26px; width: 210px; border-radius: 20px; padding: 14px 16px 10px;
    background: rgba(255,255,255,.92); box-shadow: 0 14px 30px rgba(47,122,108,.16); border: 1px solid var(--line); }
  .chart .h { display: flex; justify-content: space-between; font-size: 16px; color: var(--teal-d); font-weight: 600; }
  .chart .h small { color: #9aa7a3; font: 500 13px Poppins, sans-serif; }
  .chart .x { display: flex; justify-content: space-between; color: #9aa7a3; font: 500 12px Poppins, sans-serif; }
  .feats { display: flex; flex-direction: column; gap: 16px; }
  .feat { display: flex; align-items: center; gap: 20px; background: #fff; border: 2px solid var(--line); border-radius: 26px; padding: 18px 22px; }
  .feat i { flex: none; width: 66px; height: 66px; border-radius: 20px; background: var(--mint); display: grid; place-items: center; }
  .feat svg { width: 34px; height: 34px; stroke: var(--teal); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .feat b { font-size: 32px; font-weight: 600; color: var(--teal-d); }
  html[lang=en] .feat b { font-size: 26px; }
  .need { margin-top: 26px; display: flex; align-items: center; gap: 16px; background: var(--mint); border-radius: 22px; padding: 16px 24px;
    font-size: 27px; color: var(--teal-d); }
  html[lang=en] .need { font-size: 22px; }
  .need svg { width: 34px; height: 34px; stroke: var(--teal-d); fill: none; stroke-width: 2; }
  .cta { margin-top: 22px; background: var(--maroon); color: #fff; border-radius: 26px; padding: 22px 30px; display: flex; align-items: center;
    justify-content: center; gap: 18px; font-size: 36px; font-weight: 700; box-shadow: 0 18px 36px rgba(163,38,47,.28); }
  html[lang=en] .cta { font-size: 30px; }
  .cta svg { width: 36px; height: 36px; stroke: #fff; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .foot { margin-top: 16px; display: flex; justify-content: space-between; align-items: center; font-size: 21px; color: var(--muted); }
  html[lang=en] .foot { font-size: 18px; }
  .foot .url { font: 600 22px Poppins, sans-serif; color: var(--ink); }
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="logo"><img src="logo.png" alt="Hearing Store"></div>
    <div class="badge" data-t="badge"></div>
  </div>
  <h1 data-t="h1"></h1>
  <div class="mid">
    <div class="art">
      <div class="halo"></div>
      <svg class="man" viewBox="0 0 320 330">
        <path d="M30 330c4-70 50-110 120-112h20c70 2 116 42 120 112z" fill="#4a9688"/>
        <path d="M120 200h60v40c-10 12-50 12-60 0z" fill="#e3b28f"/>
        <path d="M70 120c0-62 40-100 92-100 56 0 92 40 92 96 0 66-40 108-96 108-30 0-50-10-62-26-8 0-26-2-30-14 6-12 4-22 4-28-8-10-6-20 0-30z" fill="#ecc6a3"/>
        <path d="M74 104C70 50 112 14 166 14c58 0 96 40 96 96 0 36-10 64-26 84-10-2-16-8-18-16 6-24 4-48-6-64-14-20-36-30-60-32-30-2-58 6-78 26z" fill="#3d2a20"/>
        <ellipse cx="208" cy="128" rx="18" ry="28" fill="#d9a57f"/>
        <circle cx="112" cy="128" r="6" fill="#1d1d1d"/>
        <path d="M100 112q12-8 24-2" stroke="#3d2a20" stroke-width="4" fill="none" stroke-linecap="round"/>
        <circle cx="120" cy="162" r="11" fill="#e9a49a" opacity=".6"/>
        <path d="M96 178q10 8 22 2" stroke="#9b4a35" stroke-width="4" fill="none" stroke-linecap="round"/>
      </svg>
      <div class="chart">
        <div class="h"><span data-t="tone"></span><small>Hz</small></div>
        <svg viewBox="0 0 180 60" width="178" height="60">
          <line x1="0" y1="50" x2="180" y2="50" stroke="#e3ece9"/>
          <polyline points="10,14 38,20 66,10 94,26 122,20 160,36" fill="none" stroke="#9fd3b8" stroke-width="3"/>
          <g fill="#4caf72"><circle cx="10" cy="14" r="7"/><circle cx="38" cy="20" r="7"/><circle cx="66" cy="10" r="7"/><circle cx="94" cy="26" r="7"/><circle cx="122" cy="20" r="7"/><circle cx="160" cy="36" r="7"/></g>
        </svg>
        <div class="x"><span>250</span><span>8k</span></div>
      </div>
    </div>
    <div class="feats">
      <div class="feat"><i><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12M12 8S10 3 7.5 4.5 9 8 12 8zm0 0s2-5 4.5-3.5S15 8 12 8z"/></svg></i><b data-t="f1"></b></div>
      <div class="feat"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></i><b data-t="f2"></b></div>
      <div class="feat"><i><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></i><b data-t="f3"></b></div>
    </div>
  </div>
  <div class="need"><svg viewBox="0 0 24 24"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-6h3zM3 19a2 2 0 0 0 2 2h1v-6H3z"/></svg><span data-t="need"></span></div>
  <div class="cta"><span data-t="cta"></span><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
  <div class="foot"><span class="url">hearingstore.com.bd/hearing-test</span><span data-t="note"></span></div>
</div>
<script>
const T = {
  bn: { badge: 'ফ্রি অনলাইন টেস্ট', h1: 'অনলাইনে কানের পরীক্ষা<span>মাত্র ৫ মিনিটে</span>', tone: 'টোন টেস্ট',
    f1: 'সম্পূর্ণ ফ্রি', f2: 'রেজিস্ট্রেশন লাগবে না', f3: 'ফলাফল সাথে সাথে',
    need: 'যা লাগবে: হেডফোন ও শান্ত একটি ঘর', cta: 'এখনই পরীক্ষা শুরু করুন', note: 'প্রাথমিক স্ক্রিনিং · অডিওলজিস্টের পরামর্শ নিন' },
  en: { badge: 'Free online test', h1: 'Check your hearing online<span>in just 5 minutes</span>', tone: 'Tone test',
    f1: 'Completely free', f2: 'No registration', f3: 'Instant results',
    need: 'You need: headphones and a quiet room', cta: 'Start the test now', note: 'Initial screening · confirm with our audiologist' }
};
const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'bn';
document.documentElement.lang = lang;
document.querySelectorAll('[data-t]').forEach(e => e.innerHTML = T[lang][e.dataset.t]);
</script>
</body>
</html>
